[mod-setting-name]
factorio-rules-debug=Debug logging
factorio-rules-violation-history-limit=Recent violation history size
factorio-rules-expected-spawn-resources=Expected Nauvis spawn resources

[mod-setting-description]
factorio-rules-debug=Write diagnostic messages to the Factorio log.
factorio-rules-violation-history-limit=Number of recent denials and warnings to retain. Set to 0 to disable history.
factorio-rules-expected-spawn-resources=Comma-separated resource prototype names expected during initial spawn discovery. Leave blank to disable validation.

[shortcut-name]
factorio-rules-toggle-zones=Toggle rule-zone overlays
